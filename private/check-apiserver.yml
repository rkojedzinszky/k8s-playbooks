---
- name: wait until apiserver becomes ready
  when: "'master' in group_names"
  ansible.builtin.command:
    argv:
      - curl
      - --max-time
      - "1"
      - -s
      - --cacert
      - /etc/kubernetes/pki/ca.crt
      - "https://{{ ip }}:6443/readyz"
  register: result
  until: "'ok' == result.stdout"
  retries: 120
  delay: 5
  tags:
    - health-check
