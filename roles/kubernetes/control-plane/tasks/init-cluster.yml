# This tasklist will do the actual initialization of a k8s cluster
---
- name: Create working directory
  ansible.builtin.tempfile:
    state: directory
  register: tempdir

- name: Parse working directory
  ansible.builtin.set_fact:
    tempdir: "{{ tempdir.path }}"

- name: Create etcd PKI directory
  ansible.builtin.file:
    path: /etc/kubernetes/pki/etcd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Generate kubernetes CA before kubeadm init
  ansible.builtin.command:
    argv:
    - kubeadm
    - init
    - phase
    - certs
    - ca
    - --cert-dir
    - /etc/kubernetes/pki
  changed_when: true

- name: Generate front-proxy CA before kubeadm init
  ansible.builtin.command:
    argv:
    - kubeadm
    - init
    - phase
    - certs
    - front-proxy-ca
    - --cert-dir
    - /etc/kubernetes/pki
  changed_when: true

- name: Generate etcd CA before kubeadm init
  ansible.builtin.command:
    argv:
    - kubeadm
    - init
    - phase
    - certs
    - etcd-ca
    - --cert-dir
    - /etc/kubernetes/pki
  changed_when: true

- name: Place etcd CA bundle from active CA
  ansible.builtin.copy:
    src: /etc/kubernetes/pki/etcd/ca.crt
    dest: /etc/kubernetes/pki/etcd/ca-bundle.crt
    remote_src: true
    owner: root
    group: root
    mode: "0644"

- name: Place kubernetes CA bundle from active CA
  ansible.builtin.copy:
    src: /etc/kubernetes/pki/ca.crt
    dest: /etc/kubernetes/pki/ca-bundle.crt
    remote_src: true
    owner: root
    group: root
    mode: "0644"

- name: Place front-proxy CA bundle from active CA
  ansible.builtin.copy:
    src: /etc/kubernetes/pki/front-proxy-ca.crt
    dest: /etc/kubernetes/pki/front-proxy-ca-bundle.crt
    remote_src: true
    owner: root
    group: root
    mode: "0644"

- name: Generate initial kubeadm config
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: "{{ tempdir }}/kubeadm-config.yaml"

- name: Initialize cluster
  ansible.builtin.command: "kubeadm init --config {{ tempdir }}/kubeadm-config.yaml"

- name: Init kube config
  ansible.builtin.file:
    path: /root/.kube
    state: directory

- name: Copy kubectl config
  ansible.builtin.command: "cp -f /etc/kubernetes/admin.conf /root/.kube/config"

- name: Cleanup
  ansible.builtin.file:
    path: "{{ tempdir }}"
    state: absent

- name: Deploy kube-router
  ansible.builtin.command: "kubectl apply -f https://raw.githubusercontent.com/cloudnativelabs/kube-router/master/daemonset/kubeadm-kuberouter.yaml"
