# Node specific sysctls can be specified here.
# Please note, that usually PODs get system defaults.
# If you want defaults for PODs, then tune it in the
# corresponding container runtime.
#
#node_sysctls:
#- net.ipv4.tcp_keepalive_intvl = 10
#- net.ipv4.tcp_keepalive_time = 60

# Kubernetes node IP address related settings
# IPv4 address can be an interface name, or an explicit address.
kubernetes_node_ipv4_address:
# IPv6 address can be an interface name, or an explicit address.
kubernetes_node_ipv6_address:
