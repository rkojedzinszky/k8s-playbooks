---
- name: Upgrade control plane
  when: inventory_hostname == groups['master'][0]
  ansible.builtin.command: kubeadm upgrade apply --yes v{{ kubernetes_version }}

- name: Upgrade node
  when: inventory_hostname != groups['master'][0]
  ansible.builtin.command: kubeadm upgrade node

- name: Update kubectl config
  ansible.builtin.command: "cp -af /etc/kubernetes/admin.conf /root/.kube/config"
  when: "'master' in group_names"
